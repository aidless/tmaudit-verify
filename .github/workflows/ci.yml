name: CI

# Test this fork on the Python versions it claims to support, plus a static
# gate. The upstream repository's CI also runs a regression-injection meta-test
# and community-file validation; those belong to the release repository and are
# intentionally not copied here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        # scipy and PyYAML are declared in the `dev` extra because several tests
        # only reach the real code path when those imports succeed. The example
        # plugin is installed separately so entry-point discovery is exercised.
        run: |
          python -m pip --version
          python -m pip install --require-hashes -r requirements.ci.lock
          python -m pip install -e . --no-deps
          python -m pip install -e ./tmaudit_example_plugin --no-deps

      - name: Build the wheel and sdist
        # tests/test_package_data.py reads the built wheel, because a file
        # missing from src/ is impossible while the reverse (present in src/,
        # absent from the wheel) is the packaging bug it guards.
        run: python -m build

      - name: Run the test suite
        # The two slow end-to-end tests need the author's private paper
        # directories, which are not in this repository. They are deselected
        # rather than left to fail for environmental reasons.
        run: python -m pytest -m "not slow" -q

  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install lint dependencies
        run: |
          python -m pip --version
          python -m pip install --require-hashes -r requirements.build.lock

      - name: Lint the shipped package
        run: python -m pyflakes src/tmaudit tmaudit_example_plugin

      - name: Check the committed pyz matches src/
        # The zero-install path is a real distribution channel here, so a stale
        # or bytecode-contaminated archive is a release defect, not cosmetics.
        run: python _check_pyz_fresh.py
