name: CI

# Test this fork on the Python versions it claims to support, plus a static
# gate. The upstream repository's CI also runs a regression-injection meta-test
# and community-file validation; those belong to the release repository and are
# intentionally not copied here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        # scipy and PyYAML are declared in the `dev` extra because several tests
        # only reach the real code path when those imports succeed. The example
        # plugin is installed separately so entry-point discovery is exercised.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./tmaudit_example_plugin

      - name: Build the wheel and sdist
        # tests/test_package_data.py reads the built wheel, because a file
        # missing from src/ is impossible while the reverse (present in src/,
        # absent from the wheel) is the packaging bug it guards.
        run: python -m build

      - name: Run the test suite
        # `-m "not slow"` drops tests that need trees this repository does
        # not contain: tests/test_corpus_regression.py (a fetched arXiv
        # corpus) and TestEndToEndAudit in tests/test_forge_happy.py
        # (PAPER*_CONSOLIDATED). The count of that selection is the sentence
        # in README.md, checked by tests/test_claims_drift.py.
        # tests/test_package_data.py opens dist/*.whl. This job builds the
        # wheel first, so that check runs here. It is not marked slow.
        run: python -m pytest -m "not slow" -q

  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes

      - name: Lint the shipped package
        run: python -m pyflakes src/tmaudit tmaudit_example_plugin

      - name: Check the committed pyz matches src/
        # The zero-install path is a real distribution channel here, so a stale
        # or bytecode-contaminated archive is a release defect, not cosmetics.
        run: python _check_pyz_fresh.py
